git_org: ics-rtp-automation
infraDir: cdk
git_repo: training-slack-chatbot
service_name: training-slack-chatbot
asset_id: "1664097655636493108"
asset_alias: jsguru.ics.rtp.automation.trainingslackchatbot

# email notification
mailRecipients: chase_allen@jsguru.com

# Artifactory
registry: docker.jsguru.com
artifactory_host: docker.jsguru.com
generic_artifactory_repo: https://artifact.jsguru.com/artifactory/generic-jsguru/ics-rtp-automation/training-slack-chatbot
# Artifactory repo path for docker image
repo: ics-rtp-automation/training-slack-chatbot/service

code_repo: github.jsguru.com/ICS-RTP-Automation/training-slack-chatbot.git
deploy_repo: github.jsguru.com/ICS-RTP-Automation/training-slack-chatbot-deployment.git

# change this to false once ready for PRD
preprodOnly: True
snow_application_name: "TODO"

# change this to true for enabling Jira stories to be transitioned
enableJiraTransition: false
# change this to true for enable Code Analysis stage
SonarQubeAnalysis: False

# change this to true for stop your pipeline in quality gate error
SonarQubeEnforce: False

# enable this to true once test suite has matured in confidence to help automate deployments
enableScorecardReadinessCheck: False
# to bypass the scorecard readiness check's fall back, gitOpsApproval, set this to true
skipScorecardManualFallback: False

# Cloud Paved Road Generator information
cloudGenLatestVersion: 1.48.1

# The below fields are needed to send build metrics to ODL as they are used by downstream MSaaS Library functions
enableBuildQualityMetrics: True
enableDeployQualityMetrics: True
enableCocoon: False
cleanupCocoon: False
cocoonBasic: "N/A"
projectType: serverless
language: python
excludeArtifactoryUri: false
coberturaReportFile: "**/coverage/cobertura/cobertura-coverage.xml"
unitTestReportFile: "**/coverage/junit/*.xml"

# CI/CD approvers list for slack integration
approvers:
  - callen12

# deploymentEnvironments is the config for each environment, see 
# https://github.jsguru.com/dev-patterns/msaas-jenkins-shared-library/blob/master/docs/vars-functionality.md#cellodeployalltargets-creates-stages-to-deploy-all-cello-environments-configured
deploymentEnvironments:
  pr-usw2-427732248780:
    ephemeralPrEnvironment: true
  # qal-usw2-427732248780:
  e2e-usw2-427732248780:

    # deploymentEnvironmentSequence is the order in which the environments are deployed, see 
    # https://github.jsguru.com/dev-patterns/msaas-jenkins-shared-library/blob/master/docs/vars-functionality.md#cellodeployalltargets-creates-stages-to-deploy-all-cello-environments-configured
deploymentEnvironmentSequence:
  - environments: pr-usw2-427732248780
  # - environments: qal-usw2-427732248780
  - environments: e2e-usw2-427732248780
lambdaHandler: chatbot_python.my_handler
