apiVersion: v1
kind: Pod
metadata:
  name: cloud-resource-jenkins-build-pods
spec:
  containers:
    - name: jnlp
      image: docker.jsguru.com/dev/build/ibp/jnlp-slave-with-docker:3.36-2_master_85
      tty: true
      args: [ "$(JENKINS_SECRET)", "$(JENKINS_AGENT_NAME)", "-url", "$(JENKINS_URL)" ]
    - name: podman
      image: docker.jsguru.com/oicp/standard/podman:v3.4.7
      tty: true
      command: [ "cat" ]
      imagePullPolicy: Always
      volumeMounts:
        - name: container-storage
          mountPath: /var/lib/containers
      resources:
        limits:
          github.com/fuse: 1
      securityContext:
        capabilities:
          add: [ "SYS_ADMIN", "SYS_RESOURCE" ]
    - name: cpd2
      image: docker.jsguru.com/oicp/standard/cpd2:1
      tty: true
      command: [ "cat" ]
      imagePullPolicy: Always
    - name: cdtools
      image: docker.jsguru.com/dev/deploy/cd/argocd-utils:stable
      tty: true
      command: [ "cat" ]
      imagePullPolicy: Always
    - name: aco
      image: docker.jsguru.com/dev-integration/argo-cloudops/service/argo-cloudops-cli:latest
      tty: true
      command: [ "cat" ]
      imagePullPolicy: Always
  volumes:
    - name: container-storage
      emptyDir: { }
